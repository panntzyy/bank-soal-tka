name: Auto-Update Bank Soal

on:
  push:
    paths:
      - '**/*.pdf'
      - 'scan.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan Folder & Generate data.json
        run: node scan.js

      - name: Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): perbarui katalog soal data.json [skip ci]"
            git push
          else
            echo "Tidak ada perubahan pada data.json"
          fi
